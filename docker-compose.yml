services:
  # ── MySQL Database ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: woodcraft_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: woodcraft_ecommerce
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: woodcraft
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: woodcraft_backend
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      APP_NAME: Woodcraft
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_FRONTEND_URL: http://localhost:5173

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: woodcraft_ecommerce
      DB_USERNAME: woodcraft
      DB_PASSWORD: secret

      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      # Tuỳ chọn — điền nếu muốn dùng các tính năng bên dưới
      GOOGLE_CLIENT_ID: ""
      OPENROUTER_API_KEY: ""
      VNPAY_TMN_CODE: ""
      VNPAY_HASH_SECRET: ""
      VNPAY_PAY_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      MOMO_PARTNER_CODE: ""
      MOMO_ACCESS_KEY: ""
      MOMO_SECRET_KEY: ""
      MOMO_ENDPOINT: "https://test-payment.momo.vn"

      RUN_MIGRATIONS: "true"
    volumes:
      - ./be/storage/app/public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: woodcraft_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_APP_NAME: Woodcraft Ecommerce
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_GOOGLE_CLIENT_ID: ""
    volumes:
      - ./fe:/app
      - fe_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  fe_node_modules:
